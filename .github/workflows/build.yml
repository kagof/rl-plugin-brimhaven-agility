name: Verify Plugin

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7

      - name: Verify version numbers match
        run: |
          runelite_plugin_properties_version=$(cat runelite-plugin.properties | sed -n 's/version=//p')
          gradle_properties_plugin_version=$(cat gradle.properties | sed -n 's/plugin_version=//p')
          [ "$runelite_plugin_properties_version" = "$gradle_properties_plugin_version" ] \
            && echo "version numbers matched on $runelite_plugin_properties_version" \
            || (echo "::error file=runelite-plugin.properties,line=7::\
          plugin version mismatched (gradle.properties version: $gradle_properties_plugin_version, runelite-plugin.properties version: $runelite_plugin_properties_version)" \
              && exit 1)

      - name: Set up OpenJDK 11
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Setup Gradle Dependencies Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}

      - name: Setup Gradle Wrapper Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Gradle test
        run: |
          ./gradlew clean test --console=plain